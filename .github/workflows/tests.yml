name: Tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: python -m pip install ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy

  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  windows:
    # What a Windows user does: install the README's two ways, start the app with the launcher, and make the Desktop shortcut with its icon.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install the way the README says, with pip (Command Prompt)
        shell: cmd
        run: |
          py -m venv .venv || exit /b 1
          .venv\Scripts\pip install --quiet -e . || exit /b 1
          .venv\Scripts\prem --version
      - name: The same command in PowerShell
        shell: pwsh
        run: |
          .venv\Scripts\prem --version
          if ($LASTEXITCODE -ne 0) { throw "prem did not start from PowerShell" }
      - name: Install the way the README says, with uv
        shell: pwsh
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}\uv-environment   # the pip route above made .venv
        run: |
          python -m pip install --quiet uv
          if ($LASTEXITCODE -ne 0) { throw "could not install uv" }
          uv sync
          if ($LASTEXITCODE -ne 0) { throw "uv sync failed" }
          uv run prem --version
          if ($LASTEXITCODE -ne 0) { throw "uv run prem failed" }
      - name: The launcher starts the demo, a second launch only opens it
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PREM_DATA_DIR = Join-Path $env:RUNNER_TEMP "prem-smoke"
          $env:PREM_NO_OPEN = "1"
          $env:PREM_PORT = "8766"
          $env:PREM_NO_UPDATE = "1"   # test this commit; the update has its own check below
          $out = Join-Path $env:RUNNER_TEMP "launcher.out"
          $err = Join-Path $env:RUNNER_TEMP "launcher.err"
          $launcher = Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "tools\prem-lab.bat", "--demo" -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          try {
            $up = $false
            foreach ($i in 1..120) {
              try { if ((Invoke-RestMethod "http://127.0.0.1:8766/api/health").status -eq "ok") { $up = $true; break } } catch { }
              Start-Sleep -Seconds 1
            }
            if (-not $up) { Get-Content $out, $err -ErrorAction SilentlyContinue; throw "the launcher did not start the app" }
            Write-Host "the launcher started the app"
            foreach ($path in @("/", "/css/tokens.css", "/js/main.js", "/js/pages/player-trend.js", "/api/meta")) {
              $response = Invoke-WebRequest "http://127.0.0.1:8766$path" -UseBasicParsing
              if ($response.StatusCode -ne 200) { throw "$path answered $($response.StatusCode)" }
            }
            Write-Host "the page and its files are served"
            $again = cmd.exe /c "tools\prem-lab.bat" 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0 -or $again -notmatch "already running") { throw "a second launch should only open the running app, but said: $again" }
            Write-Host "a second launch finds the app running"
          }
          finally {
            taskkill /PID $launcher.Id /T /F 2>&1 | Out-Null
          }
          $global:LASTEXITCODE = 0   # taskkill may find a process of the tree already gone; that is not a failure of the check
      - name: The Desktop shortcut points at the launcher and Windows can read its icon
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $folder = Join-Path $env:RUNNER_TEMP "shortcut"
          New-Item -ItemType Directory -Force $folder | Out-Null
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\make-windows-shortcut.ps1 -Folder $folder
          if ($LASTEXITCODE -ne 0) { throw "making the shortcut failed" }
          $lnk = Join-Path $folder "Prem Lab.lnk"
          if (-not (Test-Path $lnk)) { throw "no shortcut was made" }
          $link = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          if (-not $link.TargetPath.EndsWith("tools\prem-lab.bat")) { throw "the shortcut points at $($link.TargetPath)" }
          $iconPath = ($link.IconLocation -split ",")[0]
          if (-not (Test-Path $iconPath)) { throw "the shortcut's icon file is missing: $($link.IconLocation)" }
          $bytes = [System.IO.File]::ReadAllBytes($iconPath)
          $kind = [BitConverter]::ToUInt16($bytes, 2)
          $count = [BitConverter]::ToUInt16($bytes, 4)
          if ($kind -ne 1 -or $count -lt 5) { throw "not an icon file with several sizes (type $kind, $count images)" }
          Add-Type -AssemblyName System.Drawing
          foreach ($size in 16, 32, 48, 256) {
            $icon = New-Object System.Drawing.Icon($iconPath, $size, $size)
            if ($icon.Width -lt 16) { throw "Windows could not read the $size-pixel image of the icon" }
          }
          Write-Host "the shortcut points at the launcher, and its icon has $count sizes that Windows reads"
      - name: Opening the shortcut starts the app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PREM_DATA_DIR = Join-Path $env:RUNNER_TEMP "prem-shortcut"
          $env:PREM_NO_OPEN = "1"
          $env:PREM_PORT = "8767"
          $env:PREM_NO_UPDATE = "1"   # test this commit; the update has its own check below
          $env:PREM_DEMO = "1"
          Start-Process -FilePath (Join-Path $env:RUNNER_TEMP "shortcut\Prem Lab.lnk")
          try {
            $up = $false
            foreach ($i in 1..120) {
              try { if ((Invoke-RestMethod "http://127.0.0.1:8767/api/health").status -eq "ok") { $up = $true; break } } catch { }
              Start-Sleep -Seconds 1
            }
            if (-not $up) { throw "opening the shortcut did not start the app" }
            Write-Host "opening the shortcut started the app"
          }
          finally {
            Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*prem-lab.bat*" } | ForEach-Object { taskkill /PID $_.ProcessId /T /F 2>&1 | Out-Null }
          }
          $global:LASTEXITCODE = 0   # as above
      - name: The launcher takes an update first, and runs the new launcher
        # A copy of the project with a "GitHub" of its own (a local repository): publish an update that also changes the launcher, then start it.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "update"
          New-Item -ItemType Directory -Force "$root\dev" | Out-Null
          git archive -o "$root\project.tar" HEAD
          tar -xf "$root\project.tar" -C "$root\dev"
          git -C "$root\dev" -c init.defaultBranch=main init -q
          git -C "$root\dev" add -A
          git -C "$root\dev" -c user.name=CI -c user.email=ci@example.invalid commit -qm "the version the user has"
          git init -q --bare "$root\origin.git"
          git -C "$root\dev" push -q "$root\origin.git" main
          git clone -q "$root\origin.git" "$root\user"
          $bat = "$root\dev\tools\prem-lab.bat"
          (Get-Content -Raw $bat).Replace("rem what to run:", "echo NEW LAUNCHER RUNNING& exit /b 0`r`nrem what to run:") | Set-Content -NoNewline $bat
          git -C "$root\dev" -c user.name=CI -c user.email=ci@example.invalid commit -qam "feat: the update"
          git -C "$root\dev" push -q "$root\origin.git" main
          $env:PREM_NO_OPEN = "1"
          $env:PREM_PORT = "8768"
          $first = cmd.exe /c "call `"$root\user\tools\prem-lab.bat`" & set PREM_LAUNCHER_UPDATED" 2>&1 | Out-String
          Write-Host $first
          if ($first -cnotmatch "Updated\. What is new" -or $first -notmatch "feat: the update") { throw "the launcher did not take the update" }
          if ($first -notmatch "NEW LAUNCHER RUNNING") { throw "the launcher did not run its new self after the update" }
          if ($first -notmatch "not defined") { throw "the restart marker outlived the launcher" }
          if ((git -C "$root\user" rev-parse HEAD) -ne (git -C "$root\dev" rev-parse HEAD)) { throw "the copy is not at the new version" }
          $second = cmd.exe /c "`"$root\user\tools\prem-lab.bat`"" 2>&1 | Out-String
          Write-Host $second
          if ($second -notmatch "Up to date" -or $second -notmatch "NEW LAUNCHER RUNNING") { throw "a second start should find nothing new" }
          Add-Content "$root\user\README.md" "a change made here"
          $third = cmd.exe /c "`"$root\user\tools\prem-lab.bat`"" 2>&1 | Out-String
          if ($third -notmatch "have been changed here" -or $third -notmatch "NEW LAUNCHER RUNNING") { throw "local changes should stop the update, not the start: $third" }
          Write-Host "the launcher updates, restarts as the new version, and leaves a changed copy alone"
          $global:LASTEXITCODE = 0   # "set" of a missing variable fails on purpose above
      - name: Install the test tools and run the tests
        run: |
          python -m pip install ".[dev]"
          python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install project and browser tooling
        run: |
          python -m pip install ".[dev]"
          npm install
          npx playwright install --with-deps chromium
      - name: Unit tests for frontend helpers
        run: npm test
      - name: Start the demo server
        run: |
          PREM_DATA_DIR="$RUNNER_TEMP/prem" python -m app.cli serve --demo --no-open --port 8765 --today 2027-03-10 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8765/api/health && break; sleep 1; done
      - name: End-to-end checks in headless Chromium
        run: npm run e2e
