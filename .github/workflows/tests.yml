name: Tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: python -m pip install ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy

  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  windows:
    # What a Windows user does: install the README's two ways, start the app with the launcher, and make the Desktop shortcut with its icon.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: The README's two ways to install (pip in a virtual environment, and uv)
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pip install --quiet .
          "$RUNNER_TEMP/venv/Scripts/prem.exe" --version
          python -m pip install --quiet uv
          uv sync
          uv run prem --version
      - name: The launcher starts the demo, a second launch only opens it
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PREM_DATA_DIR = Join-Path $env:RUNNER_TEMP "prem-smoke"
          $env:PREM_NO_OPEN = "1"
          $env:PREM_PORT = "8766"
          $out = Join-Path $env:RUNNER_TEMP "launcher.out"
          $err = Join-Path $env:RUNNER_TEMP "launcher.err"
          $launcher = Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "tools\prem-lab.bat", "--demo" -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          try {
            $up = $false
            foreach ($i in 1..120) {
              try { if ((Invoke-RestMethod "http://127.0.0.1:8766/api/health").status -eq "ok") { $up = $true; break } } catch { }
              Start-Sleep -Seconds 1
            }
            if (-not $up) { Get-Content $out, $err -ErrorAction SilentlyContinue; throw "the launcher did not start the app" }
            Write-Host "the launcher started the app"
            foreach ($path in @("/", "/css/tokens.css", "/js/main.js", "/js/pages/player-trend.js", "/api/meta")) {
              $response = Invoke-WebRequest "http://127.0.0.1:8766$path" -UseBasicParsing
              if ($response.StatusCode -ne 200) { throw "$path answered $($response.StatusCode)" }
            }
            Write-Host "the page and its files are served"
            $again = cmd.exe /c "tools\prem-lab.bat" 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0 -or $again -notmatch "already running") { throw "a second launch should only open the running app, but said: $again" }
            Write-Host "a second launch finds the app running"
          }
          finally {
            taskkill /PID $launcher.Id /T /F | Out-Null
          }
      - name: The Desktop shortcut points at the launcher and Windows can read its icon
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $folder = Join-Path $env:RUNNER_TEMP "shortcut"
          New-Item -ItemType Directory -Force $folder | Out-Null
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\make-windows-shortcut.ps1 -Folder $folder
          if ($LASTEXITCODE -ne 0) { throw "making the shortcut failed" }
          $lnk = Join-Path $folder "Prem Lab.lnk"
          if (-not (Test-Path $lnk)) { throw "no shortcut was made" }
          $link = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          if (-not $link.TargetPath.EndsWith("tools\prem-lab.bat")) { throw "the shortcut points at $($link.TargetPath)" }
          $iconPath = ($link.IconLocation -split ",")[0]
          if (-not (Test-Path $iconPath)) { throw "the shortcut's icon file is missing: $($link.IconLocation)" }
          $bytes = [System.IO.File]::ReadAllBytes($iconPath)
          $kind = [BitConverter]::ToUInt16($bytes, 2)
          $count = [BitConverter]::ToUInt16($bytes, 4)
          if ($kind -ne 1 -or $count -lt 5) { throw "not an icon file with several sizes (type $kind, $count images)" }
          Add-Type -AssemblyName System.Drawing
          foreach ($size in 16, 32, 48, 256) {
            $icon = New-Object System.Drawing.Icon($iconPath, $size, $size)
            if ($icon.Width -lt 16) { throw "Windows could not read the $size-pixel image of the icon" }
          }
          Write-Host "the shortcut points at the launcher, and its icon has $count sizes that Windows reads"
      - name: Install the test tools and run the tests
        # temporarily allowed to fail: the first run shows what, if anything, differs on Windows
        continue-on-error: true
        run: |
          python -m pip install ".[dev]"
          python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install project and browser tooling
        run: |
          python -m pip install ".[dev]"
          npm install
          npx playwright install --with-deps chromium
      - name: Unit tests for frontend helpers
        run: npm test
      - name: Start the demo server
        run: |
          PREM_DATA_DIR="$RUNNER_TEMP/prem" python -m app.cli serve --demo --no-open --port 8765 --today 2027-03-10 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8765/api/health && break; sleep 1; done
      - name: End-to-end checks in headless Chromium
        run: npm run e2e
