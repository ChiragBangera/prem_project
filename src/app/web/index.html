  <script>
    // Apply the saved theme before first paint so there is no light flash in dark mode.
    try {
      var saved = JSON.parse(localStorage.getItem("prem.ui.v1") || "null");
      if (saved && (saved.theme === "light" || saved.theme === "dark")) document.documentElement.dataset.theme = saved.theme;
    } catch (e) {}
  </script>
