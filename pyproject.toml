[project]
name = "prem-lab"
version = "2.0.0"
description = "A personal, local-first football analytics workbench powered by Understat data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Chirag Bangera" },
]
keywords = ["football", "soccer", "analytics", "understat", "xg", "scouting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "aiohttp>=3.11,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]
# Optional event data (passes, duels, tackles) read from WhoScored; needs Chrome, Chromium, Brave or Edge installed.
events = [
    "soccerdata>=1.9,<2",
]

[project.scripts]
prem = "app.cli:main"
prem-app = "app.cli:serve_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
app = ["web/**/*", "data/*.json"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::ResourceWarning", "ignore:Using `httpx` with `starlette.testclient`"]
